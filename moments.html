<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>Our Moments — Doris' Birthday</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;0,700;1,300;1,400;1,600&family=Italiana&family=Lato:wght@300;400&family=Alex+Brush&display=swap" rel="stylesheet"/>
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div class="cur-dot" id="cDot"></div>
    <div class="cur-ring" id="cRing"></div>
    <canvas id="bg-stars" class="visible"></canvas>
    
    <audio id="bgm" loop>
        <source src="https://commons.wikimedia.org/wiki/Special:FilePath/Happy_Birthday_to_You_(piano).ogg" type="audio/ogg"/>
    </audio>

    <button class="music-pill paused" id="mBtn">
        <div class="mbars"><div class="mbar"></div><div class="mbar"></div><div class="mbar"></div></div>
        <span id="mLbl">Play music</span>
    </button>

    <div class="page-dots" id="pageDots"></div>

    <div class="page dark-page" id="p2">
        <div class="neb" style="width:60vw;height:40vw;max-width:580px;background:rgba(107,142,240,.1);top:-5%;right:-10%;"></div>
        <div class="neb" style="width:45vw;height:35vw;max-width:460px;background:rgba(232,84,122,.08);bottom:0;left:-5%;"></div>
        <div class="cosmos-planet pl-w1"></div>
        <div class="cosmos-planet pl-w2"></div>
        <div class="shoot shoot-1" style="animation-delay:1s;"></div>
        <div class="ch-lbl rose">Radiance</div>
        <h2 class="sec-title"><em>Her beauty</em><br/>captured in time</h2>
        <div class="photo-grid">
            <div class="pc" data-caption="A smile that lights up the room">
                <img src="assets/img/doris_1.jpg" class="pc-img" alt="Memory 1"/>
                <div class="pc-glass"></div>
            </div>
            <div class="pc" data-caption="Effortlessly stunning">
                <img src="assets/img/doris_2.jpg" class="pc-img" alt="Memory 2"/>
                <div class="pc-glass"></div>
            </div>
            <div class="pc" data-caption="Grace in every moment">
                <img src="assets/img/doris_3.jpg" class="pc-img" alt="Memory 3"/>
                <div class="pc-glass"></div>
            </div>
            <div class="pc" data-caption="The center of my universe">
                <img src="assets/img/doris_4.jpg" class="pc-img" alt="Memory 4"/>
                <div class="pc-glass"></div>
            </div>
            <div class="pc" data-caption="Pure elegance">
                <img src="assets/img/doris_5.jpg" class="pc-img" alt="Memory 5"/>
                <div class="pc-glass"></div>
            </div>
            <div class="pc" data-caption="Radiating joy">
                <img src="assets/img/doris_6.jpg" class="pc-img" alt="Memory 6"/>
                <div class="pc-glass"></div>
            </div>
            <div class="pc" data-caption="Unforgettable beauty">
                <img src="assets/img/doris_7.jpg" class="pc-img" alt="Memory 7"/>
                <div class="pc-glass"></div>
            </div>
            <div class="pc" data-caption="Simply perfect">
                <img src="assets/img/doris_8.jpg" class="pc-img" alt="Memory 8"/>
                <div class="pc-glass"></div>
            </div>
        </div>
        <a href="letter.html" class="pg-next">
            <svg viewBox="0 0 10 10" fill="none"><path d="M5 1L9 5L5 9M1 5H9" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/></svg>
            Next
        </a>
    </div>

    <!-- Lightbox Modal -->
    <div class="lb-modal" id="lbModal">
        <div class="lb-close" id="lbClose">×</div>
        <div class="lb-content">
            <img src="" class="lb-img" id="lbImg" alt="Preview"/>
            <div class="lb-caption" id="lbCap"></div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof tryMusic === 'function') tryMusic();
        });

        // Lightbox Logic
        const modal = document.getElementById('lbModal');
        const lbImg = document.getElementById('lbImg');
        const lbCap = document.getElementById('lbCap');
        const lbClose = document.getElementById('lbClose');
        const pcs = document.querySelectorAll('.pc');

        pcs.forEach(pc => {
            pc.addEventListener('click', () => {
                const img = pc.querySelector('.pc-img').src;
                const cap = pc.getAttribute('data-caption');
                lbImg.src = img;
                lbCap.textContent = cap;
                modal.classList.add('active');
            });
        });

        lbClose.addEventListener('click', () => {
            modal.classList.remove('active');
        });

        modal.addEventListener('click', (e) => {
            if (e.target === modal) {
                modal.classList.remove('active');
            }
        });
    </script>
</body>
</html>
